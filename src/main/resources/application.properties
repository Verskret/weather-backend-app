# Název serveru a port
server.port=${PORT:8080}

# Nastavení H2 databáze do souboru (data nevyprchají při restartu)
spring.datasource.url=jdbc:h2:file:./data/weatherdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Povolení konzole pro kontrolu dat
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate nastavení pro automatické vytváření tabulek
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect